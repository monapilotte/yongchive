<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YONGchive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #fff; --border: #e0ddd6;
      --text: #1a1a1a; --text-sub: #777;
      --accent: #1a4fa0; --accent-light: #e8eef8;
      --mono: 'DM Mono', monospace; --sans: 'Noto Sans KR', sans-serif; --radius: 6px;
    }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; height: 56px; }
    .site-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .site-title span { color: var(--accent); }

    /* HERO */
    .hero { max-width: 960px; margin: 0 auto; padding: 36px 24px 24px; display: flex; align-items: flex-end; gap: 20px; border-bottom: 1px solid var(--border); }
    .hero-badge { font-family: var(--mono); font-size: 11px; background: var(--accent); color: #fff; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.5px; }
    .hero-name { font-size: 36px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .hero-sub { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
    .hero-stats { margin-left: auto; display: flex; gap: 24px; text-align: center; }
    .stat-item label { display: block; font-size: 11px; color: var(--text-sub); font-family: var(--mono); margin-bottom: 2px; }
    .stat-item span { font-size: 22px; font-weight: 700; color: var(--accent); }

    /* CONTAINER */
    .container { max-width: 960px; margin: 0 auto; padding: 28px 24px; }

    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-btn { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-sub); background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 16px; cursor: pointer; transition: color 0.15s, border-color 0.15s; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 180px; font-family: var(--sans); font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; background: var(--surface); outline: none; transition: border-color 0.15s; }
    .search-box:focus { border-color: var(--accent); }
    .date-range { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .date-range input { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; background: var(--surface); outline: none; color: var(--text); transition: border-color 0.15s; width: 130px; }
    .date-range input:focus { border-color: var(--accent); }
    .date-range span { font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    .btn-date-clear { font-family: var(--mono); font-size: 11px; color: var(--text-sub); background: none; border: none; cursor: pointer; padding: 4px; }
    .btn-date-clear:hover { color: var(--accent); }
    .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-btn { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; background: var(--surface); cursor: pointer; color: var(--text-sub); transition: all 0.15s; }
    .tag-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sort-btn { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 10px; background: var(--surface); cursor: pointer; color: var(--text-sub); transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

    /* ARTICLE LIST */
    .article-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .article-item { background: var(--surface); display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 16px; padding: 14px 16px; text-decoration: none; color: inherit; transition: background 0.1s; }
    .article-item:hover { background: #fafafa; }
    .article-date { font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    .article-title { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .article-right { display: flex; align-items: center; gap: 8px; }
    .article-source { font-size: 11px; color: var(--text-sub); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; white-space: nowrap; }
    .item-tag { font-size: 10px; font-family: var(--mono); border-radius: 3px; padding: 2px 6px; background: var(--accent-light); color: var(--accent); }

    /* EMPTY STATE */
    .empty-state { padding: 40px; text-align: center; font-size: 13px; color: var(--text-sub); font-family: var(--mono); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

    /* VIDEO GRID */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .video-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.15s; text-decoration: none; color: inherit; display: block; }
    .video-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .video-thumb { position: relative; width: 100%; padding-top: 56.25%; background: #111; overflow: hidden; }
    .video-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    .video-card:hover .video-thumb img { transform: scale(1.03); }
    .video-info { padding: 12px 14px; }
    .video-info h3 { font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
    .video-meta { font-size: 11px; color: var(--text-sub); font-family: var(--mono); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .year-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .month-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; min-height: 28px; }
    .year-btn, .month-btn { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; background: var(--surface); cursor: pointer; color: var(--text-sub); transition: all 0.15s; }
    .year-btn:hover, .month-btn:hover { border-color: var(--accent); color: var(--accent); }
    .year-btn.active, .month-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* STORY GRID */
    .story-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .story-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow 0.15s; }
    .story-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .story-img-wrap { position: relative; width: 100%; padding-top: 125%; background: #eee; overflow: hidden; }
    .story-img-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    .story-card:hover .story-img-wrap img { transform: scale(1.03); }
    .story-info { padding: 8px 10px; }
    .story-date { font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    .story-memo { font-size: 12px; margin-top: 3px; line-height: 1.4; color: var(--text); }

    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 88vh; border-radius: 4px; }
    .lightbox-close { position: absolute; top: 20px; right: 28px; font-size: 28px; color: #fff; cursor: pointer; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.3); border: none; padding: 8px 14px; border-radius: 4px; transition: background 0.15s; }
    .lb-nav:hover { background: rgba(0,0,0,0.6); }
    #lb-prev { left: 16px; } #lb-next { right: 16px; }

    /* RESULT COUNT */
    .result-count { font-family: var(--mono); font-size: 11px; color: var(--text-sub); margin-bottom: 10px; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); margin-top: 60px; padding: 20px 24px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    footer a { color: var(--text-sub); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .hero { flex-direction: column; align-items: flex-start; }
      .hero-stats { margin-left: 0; }
      .article-item { grid-template-columns: 1fr; gap: 4px; }
      .article-right { justify-content: flex-start; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-title">YONG<span>chive</span></div>
  </div>
</header>

<div class="hero">
  <div>
    <div class="hero-badge">LOTTE GIANTS</div>
    <div style="height:8px"></div>
    <div class="hero-name">최준용</div>
    <div class="hero-sub">2001. 10. 10. · #56</div>
  </div>
  <div class="hero-stats">
    <div class="stat-item"><label>기사</label><span id="stat-articles">-</span></div>
    <div class="stat-item"><label>영상</label><span id="stat-videos">-</span></div>
    <div class="stat-item"><label>SNS</label><span id="stat-gallery">-</span></div>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('articles', this)">📰 기사</button>
    <button class="tab-btn" onclick="switchTab('videos', this)">🎥 영상</button>
    <button class="tab-btn" onclick="switchTab('stories', this)">📸 SNS</button>
  </div>

  <!-- 기사 -->
  <div id="tab-articles" class="tab-section active">
    <div class="toolbar">
      <input class="search-box" type="text" id="article-search" placeholder="기사 제목 검색..." oninput="renderArticles()" />
      <div class="date-range">
        <input type="date" id="a-date-from" onchange="renderArticles()" />
        <span>~</span>
        <input type="date" id="a-date-to" onchange="renderArticles()" />
        <button class="btn-date-clear" onclick="clearDateRange('a'); renderArticles()" title="날짜 초기화">✕</button>
      </div>
      <button class="sort-btn active" id="a-sort-btn" onclick="toggleSort('a')">최신순 ↓</button>
    </div>
    <div class="tag-filters" id="article-tags" style="margin-bottom:14px"></div>
    <div class="result-count" id="article-count-label"></div>
    <div id="article-list"></div>
  </div>

  <!-- 영상 -->
  <div id="tab-videos" class="tab-section">
    <div class="toolbar">
      <input class="search-box" type="text" id="video-search" placeholder="영상 제목 검색..." oninput="renderVideos()" />
      <div class="date-range">
        <input type="date" id="v-date-from" onchange="renderVideos()" />
        <span>~</span>
        <input type="date" id="v-date-to" onchange="renderVideos()" />
        <button class="btn-date-clear" onclick="clearDateRange('v'); renderVideos()" title="날짜 초기화">✕</button>
      </div>
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0">
        <input type="checkbox" id="v-exclude-shorts" onchange="renderVideos()" style="width:14px;height:14px;accent-color:var(--accent)" />
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-sub);white-space:nowrap">쇼츠 제외</span>
      </label>
      <button class="sort-btn active" id="v-sort-btn" onclick="toggleSort('v')">최신순 ↓</button>
    </div>
    <div class="tag-filters" id="video-tags" style="margin-bottom:14px"></div>
    <div class="result-count" id="video-count-label"></div>
    <div id="video-grid" class="video-grid"></div>
  </div>

  <!-- 스토리 -->
  <div id="tab-stories" class="tab-section">
    <div class="year-filters" id="story-year-filters"></div>
    <div class="month-filters" id="story-month-filters"></div>
    <div class="result-count" id="story-count-label"></div>
    <div class="story-grid" id="story-grid"></div>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLbOverlay(event)">
  <span class="lightbox-close" onclick="closeLb()">✕</span>
  <button class="lb-nav" id="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="" />
  <button class="lb-nav" id="lb-next" onclick="lbNav(1)">›</button>
</div>

<footer>
  <a href="https://spin-spin.com/monapi_lotte" target="_blank">monapi_lotte</a>
  <span style="margin: 0 10px; opacity: 0.3">|</span>
  <a href="https://x.com/monapi_lotte" target="_blank">𝕏 Twitter</a>
  <span style="margin: 0 10px; opacity: 0.3">|</span>
  <a href="https://www.instagram.com/monapi_lotte/" target="_blank">Instagram</a>
</footer>

<script>
  let DATA = { articles: [], videos: [], stories: [] };
  let activeArticleTag = 'all', activeVideoTag = 'all', lbIndex = 0;
  let sortDesc = { a: true, v: true }; // true = 최신순, false = 오래된순

  function toggleSort(prefix) {
    sortDesc[prefix] = !sortDesc[prefix];
    const btn = document.getElementById(`${prefix}-sort-btn`);
    btn.textContent = sortDesc[prefix] ? '최신순 ↓' : '오래된순 ↑';
    btn.classList.toggle('active', sortDesc[prefix]);
    prefix === 'a' ? renderArticles() : renderVideos();
  }

  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      DATA = await res.json();
      if (!DATA.stories) DATA.stories = [];
    } catch(e) {
      DATA = { articles: [], videos: [], gallery: [] };
    }
    DATA.articles.sort((a,b) => b.date.localeCompare(a.date));
    DATA.videos.sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('stat-articles').textContent = DATA.articles.length;
    document.getElementById('stat-videos').textContent   = DATA.videos.length;
    document.getElementById('stat-gallery').textContent  = DATA.stories.length;
    buildTagFilters(); buildStoryFilters(); renderArticles(); renderVideos(); renderStories();
  }

  function buildTagFilters() {
    const aTags = ['all', ...new Set(DATA.articles.flatMap(a => a.tags||[]))];
    const vTags = ['all', ...new Set(DATA.videos.flatMap(v => v.tags||[]))];
    document.getElementById('article-tags').innerHTML = aTags.map(t =>
      `<button class="tag-btn ${t==='all'?'active':''}" onclick="setArticleTag('${t}',this)">${t==='all'?'전체':t}</button>`).join('');
    document.getElementById('video-tags').innerHTML = vTags.map(t =>
      `<button class="tag-btn ${t==='all'?'active':''}" onclick="setVideoTag('${t}',this)">${t==='all'?'전체':t}</button>`).join('');
  }

  function setArticleTag(tag, btn) {
    activeArticleTag = tag;
    document.querySelectorAll('#article-tags .tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderArticles();
  }
  function setVideoTag(tag, btn) {
    activeVideoTag = tag;
    document.querySelectorAll('#video-tags .tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderVideos();
  }

  function clearDateRange(prefix) {
    document.getElementById(`${prefix}-date-from`).value = '';
    document.getElementById(`${prefix}-date-to`).value = '';
  }

  function renderArticles() {
    const q    = document.getElementById('article-search').value.toLowerCase();
    const from = document.getElementById('a-date-from').value;
    const to   = document.getElementById('a-date-to').value;
    let filtered = DATA.articles.filter(a =>
      (activeArticleTag==='all' || (a.tags||[]).includes(activeArticleTag)) &&
      (!q    || a.title.toLowerCase().includes(q) || a.source.toLowerCase().includes(q)) &&
      (!from || a.date >= from) &&
      (!to   || a.date <= to)
    );
    filtered = [...filtered].sort((a,b) =>
      sortDesc.a ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)
    );
    document.getElementById('article-count-label').textContent = `${filtered.length}건 / 전체 ${DATA.articles.length}건`;
    if (!filtered.length) { document.getElementById('article-list').innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>'; return; }
    document.getElementById('article-list').innerHTML = '<div class="article-list">' +
      filtered.map(a => `
        <a class="article-item" href="${a.url}" target="_blank">
          <span class="article-date">${a.date}</span>
          <span class="article-title">${a.title}</span>
          <span class="article-right">
            ${(a.tags||[]).map(t=>`<span class="item-tag">${t}</span>`).join('')}
            <span class="article-source">${a.source}</span>
          </span>
        </a>`).join('') + '</div>';
  }

  function renderVideos() {
    const q           = document.getElementById('video-search').value.toLowerCase();
    const from        = document.getElementById('v-date-from').value;
    const to          = document.getElementById('v-date-to').value;
    const noShorts    = document.getElementById('v-exclude-shorts').checked;
    let filtered = DATA.videos.filter(v =>
      (activeVideoTag==='all' || (v.tags||[]).includes(activeVideoTag)) &&
      (!q       || v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q)) &&
      (!from    || v.date >= from) &&
      (!to      || v.date <= to) &&
      (!noShorts || !(v.tags||[]).includes('쇼츠'))
    );
    filtered = [...filtered].sort((a,b) =>
      sortDesc.v ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)
    );
    document.getElementById('video-count-label').textContent = `${filtered.length}건 / 전체 ${DATA.videos.length}건`;
    if (!filtered.length) { document.getElementById('video-grid').innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>'; return; }
    document.getElementById('video-grid').innerHTML = filtered.map(v => `
      <a class="video-card" href="https://www.youtube.com/watch?v=${v.videoId}${v.start ? '&t=' + v.start : ''}" target="_blank">
        <div class="video-thumb">
          <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" alt="${v.title}" loading="lazy" />
        </div>
        <div class="video-info">
          <h3>${v.title}</h3>
          <div class="video-meta">
            <span>${v.date}</span><span>·</span><span>${v.channel}</span>
            ${(v.tags||[]).map(t=>`<span class="item-tag">${t}</span>`).join('')}
          </div>
        </div>
      </a>`).join('');
  }

  let activeStoryYear = 'all', activeStoryMonth = 'all';

  function buildStoryFilters() {
    const years = ['all', ...new Set(DATA.stories.map(s => s.date.slice(0,4))).values()].sort((a,b) => b > a ? 1 : -1);
    document.getElementById('story-year-filters').innerHTML = years.map(y =>
      `<button class="year-btn ${y==='all'?'active':''}" onclick="setStoryYear('${y}',this)">${y==='all'?'전체':y}</button>`
    ).join('');
    buildMonthFilters();
  }

  function buildMonthFilters() {
    const monthWrap = document.getElementById('story-month-filters');
    if (activeStoryYear === 'all') { monthWrap.innerHTML = ''; return; }
    const months = ['all', ...new Set(
      DATA.stories.filter(s => s.date.startsWith(activeStoryYear)).map(s => s.date.slice(5,7))
    ).values()].sort();
    monthWrap.innerHTML = months.map(m =>
      `<button class="month-btn ${m==='all'?'active':''}" onclick="setStoryMonth('${m}',this)">${m==='all'?'전체':parseInt(m)+'월'}</button>`
    ).join('');
  }

  function setStoryYear(year, btn) {
    activeStoryYear = year;
    activeStoryMonth = 'all';
    document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildMonthFilters();
    renderStories();
  }

  function setStoryMonth(month, btn) {
    activeStoryMonth = month;
    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderStories();
  }

  function renderStories() {
    let items = [...DATA.stories].sort((a,b) => b.date.localeCompare(a.date));
    if (activeStoryYear !== 'all') items = items.filter(s => s.date.startsWith(activeStoryYear));
    if (activeStoryMonth !== 'all') items = items.filter(s => s.date.slice(5,7) === activeStoryMonth);
    document.getElementById('stat-gallery').textContent = DATA.stories.length;
    document.getElementById('story-count-label').textContent = `${items.length}장 / 전체 ${DATA.stories.length}장`;
    if (!items.length) {
      document.getElementById('story-grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1">해당 기간의 SNS가 없습니다.</div>';
      return;
    }
    document.getElementById('story-grid').innerHTML = items.map((s, i) => `
      <div class="story-card" onclick="openLb(${DATA.stories.indexOf(s)})">
        <div class="story-img-wrap">
          <img src="${s.url}" alt="${s.memo||''}" loading="lazy"
            onerror="this.parentElement.innerHTML='<span style=position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px>로드 실패</span>'" />
        </div>
        <div class="story-info">
          <div class="story-date">${s.date}</div>
          ${s.memo ? `<div class="story-memo">${s.memo}</div>` : ''}
        </div>
      </div>`).join('');
  }

  function openLb(i) {
    const items = [...DATA.stories].sort((a,b) => b.date.localeCompare(a.date));
    lbIndex = i;
    document.getElementById('lb-img').src = items[i].url;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
  function closeLbOverlay(e) { if(e.target===document.getElementById('lightbox')) closeLb(); }
  function lbNav(dir) {
    const items = [...DATA.stories].sort((a,b) => b.date.localeCompare(a.date));
    lbIndex = (lbIndex + dir + items.length) % items.length;
    document.getElementById('lb-img').src = items[lbIndex].url;
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key==='ArrowLeft') lbNav(-1);
    if (e.key==='ArrowRight') lbNav(1);
    if (e.key==='Escape') closeLb();
  });

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    btn.classList.add('active');
  }

  loadData();
</script>
</body>
</html>
