<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YONGchive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e0ddd6;
      --text: #1a1a1a;
      --text-sub: #777;
      --accent: #1a4fa0;
      --accent-light: #e8eef8;
      --mono: 'DM Mono', monospace;
      --sans: 'Noto Sans KR', sans-serif;
      --radius: 6px;
    }

    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 960px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
    }
    .site-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .site-title span { color: var(--accent); }

    /* HERO */
    .hero {
      max-width: 960px; margin: 0 auto;
      padding: 36px 24px 24px;
      display: flex; align-items: flex-end; gap: 20px;
      border-bottom: 1px solid var(--border);
    }
    .hero-badge {
      font-family: var(--mono); font-size: 11px;
      background: var(--accent); color: #fff;
      padding: 3px 8px; border-radius: 3px; letter-spacing: 0.5px;
    }
    .hero-name { font-size: 36px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .hero-sub { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
    .hero-stats { margin-left: auto; display: flex; gap: 24px; text-align: center; }
    .stat-item label { display: block; font-size: 11px; color: var(--text-sub); font-family: var(--mono); margin-bottom: 2px; }
    .stat-item span { font-size: 22px; font-weight: 700; color: var(--accent); }

    /* CONTAINER */
    .container { max-width: 960px; margin: 0 auto; padding: 28px 24px; }

    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-btn {
      font-family: var(--sans); font-size: 13px; font-weight: 500;
      color: var(--text-sub); background: none; border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 16px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* SEARCH + FILTER BAR */
    .toolbar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 180px;
      font-family: var(--sans); font-size: 13px;
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 12px; background: var(--surface);
      outline: none; transition: border-color 0.15s;
    }
    .search-box:focus { border-color: var(--accent); }
    .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-btn {
      font-family: var(--mono); font-size: 11px;
      border: 1px solid var(--border); border-radius: 20px;
      padding: 4px 10px; background: var(--surface);
      cursor: pointer; color: var(--text-sub);
      transition: all 0.15s;
    }
    .tag-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ARTICLE LIST */
    .article-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .article-item {
      background: var(--surface);
      display: grid; grid-template-columns: 96px 1fr auto;
      align-items: center; gap: 16px; padding: 14px 16px;
      text-decoration: none; color: inherit; transition: background 0.1s;
    }
    .article-item:hover { background: #fafafa; }
    .article-date { font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    .article-title { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .article-right { display: flex; align-items: center; gap: 8px; }
    .article-source {
      font-size: 11px; color: var(--text-sub);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; padding: 2px 7px; white-space: nowrap;
    }
    .item-tag {
      font-size: 10px; font-family: var(--mono);
      border-radius: 3px; padding: 2px 6px;
      background: var(--accent-light); color: var(--accent);
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 40px; text-align: center;
      font-size: 13px; color: var(--text-sub); font-family: var(--mono);
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
    }

    /* VIDEO GRID */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .video-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.15s; }
    .video-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .video-thumb { position: relative; width: 100%; padding-top: 56.25%; background: #111; }
    .video-thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .video-info { padding: 12px 14px; }
    .video-info h3 { font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
    .video-meta { font-size: 11px; color: var(--text-sub); font-family: var(--mono); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* GALLERY */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gallery-cell {
      aspect-ratio: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 11px; color: var(--text-sub);
      cursor: pointer; position: relative;
    }
    .gallery-cell img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    .gallery-cell:hover img { transform: scale(1.04); }

    /* 입력 패널 */
    .input-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px;
    }
    .input-panel summary {
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--accent); list-style: none; display: flex; align-items: center; gap: 6px;
    }
    .input-panel summary::-webkit-details-marker { display: none; }
    .input-panel summary::before { content: '＋'; font-size: 15px; }
    details[open] > summary::before { content: '－'; }
    .panel-body { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-row input, .input-row textarea, .input-row select {
      font-family: var(--sans); font-size: 13px;
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 10px; background: var(--bg); outline: none;
      transition: border-color 0.15s; flex: 1; min-width: 140px;
    }
    .input-row input:focus, .input-row textarea:focus { border-color: var(--accent); background: #fff; }
    .input-row textarea { resize: vertical; min-height: 80px; font-size: 12px; }
    .btn-gen {
      font-family: var(--mono); font-size: 12px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); padding: 9px 18px; cursor: pointer;
      transition: opacity 0.15s; white-space: nowrap;
    }
    .btn-gen:hover { opacity: 0.85; }
    .btn-gen.green { background: #2d6a4f; }
    .btn-copy {
      font-family: var(--mono); font-size: 11px;
      background: var(--bg); color: var(--accent);
      border: 1px solid var(--accent); border-radius: var(--radius);
      padding: 6px 14px; cursor: pointer; transition: background 0.15s; align-self: flex-start;
    }
    .btn-copy:hover { background: var(--accent-light); }
    .json-output {
      font-family: var(--mono); font-size: 12px;
      background: #1a1a1a; color: #a8d8a8;
      border-radius: var(--radius); padding: 14px;
      white-space: pre-wrap; overflow-x: auto; line-height: 1.6;
    }
    .output-label { font-family: var(--mono); font-size: 11px; color: var(--text-sub); }
    .output-block { display: flex; flex-direction: column; gap: 8px; }
    .gallery-preview-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px;
    }
    .gallery-preview-grid img {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      border-radius: var(--radius); border: 1px solid var(--border);
    }
    .preview-err {
      aspect-ratio: 1; background: var(--bg);
      border: 1px dashed var(--border); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; color: var(--text-sub);
    }

    /* 라이트박스 */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.88); align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 88vh; border-radius: 4px; }
    .lightbox-close {
      position: absolute; top: 20px; right: 28px;
      font-size: 28px; color: #fff; cursor: pointer; line-height: 1;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 28px; color: #fff; cursor: pointer;
      background: rgba(0,0,0,0.3); border: none;
      padding: 8px 14px; border-radius: 4px; transition: background 0.15s;
    }
    .lb-nav:hover { background: rgba(0,0,0,0.6); }
    #lb-prev { left: 16px; }
    #lb-next { right: 16px; }

    /* RESULT COUNT */
    .result-count {
      font-family: var(--mono); font-size: 11px; color: var(--text-sub);
      margin-bottom: 10px;
    }

    /* 관리자 잠금 */
    .admin-lock {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 24px;
      padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--mono); font-size: 12px; color: var(--text-sub);
    }
    .admin-lock input {
      font-family: var(--mono); font-size: 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 5px 10px; background: var(--surface); outline: none;
      width: 140px; transition: border-color 0.15s;
    }
    .admin-lock input:focus { border-color: var(--accent); }
    .admin-lock button {
      font-family: var(--mono); font-size: 11px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); padding: 5px 12px; cursor: pointer;
    }
    .admin-lock .lock-status { font-size: 11px; }
    .admin-panels { display: none; }
    .admin-panels.unlocked { display: block; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border); margin-top: 60px;
      padding: 20px 24px; text-align: center;
      font-family: var(--mono); font-size: 11px; color: var(--text-sub);
    }
    footer a { color: var(--text-sub); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .hero { flex-direction: column; align-items: flex-start; }
      .hero-stats { margin-left: 0; }
      .article-item { grid-template-columns: 1fr; gap: 4px; }
      .article-right { justify-content: flex-start; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-title">YONG<span>chive</span></div>
  </div>
</header>

<div class="hero">
  <div>
    <div class="hero-badge">LOTTE GIANTS</div>
    <div style="height:8px"></div>
    <div class="hero-name">최준용</div>
    <div class="hero-sub">2001. 10. 10. · #56</div>
  </div>
  <div class="hero-stats">
    <div class="stat-item"><label>기사</label><span id="stat-articles">-</span></div>
    <div class="stat-item"><label>영상</label><span id="stat-videos">-</span></div>
    <div class="stat-item"><label>사진</label><span id="stat-gallery">-</span></div>
  </div>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('articles', this)">📰 기사</button>
    <button class="tab-btn" onclick="switchTab('videos', this)">🎥 영상</button>
    <button class="tab-btn" onclick="switchTab('gallery', this)">🖼️ 갤러리</button>
  </div>

  <div class="admin-lock">
    <span>🔒</span>
    <input type="password" id="admin-pw" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')checkPw()" />
    <button onclick="checkPw()">입력</button>
    <span class="lock-status" id="lock-status"></span>
  </div>

  <!-- 기사 탭 -->
  <div id="tab-articles" class="tab-section active">

    <div class="admin-panels" id="admin-articles">
    <details class="input-panel">
      <summary>기사 추가하기</summary>
      <div class="panel-body">
        <div class="input-row">
          <input type="date" id="a-date" />
          <input type="text" id="a-source" placeholder="매체명 (예: 스포츠조선)" style="max-width:200px" />
        </div>
        <div class="input-row">
          <input type="text" id="a-title" placeholder="기사 제목" />
        </div>
        <div class="input-row">
          <input type="url" id="a-url" placeholder="기사 URL (https://...)" />
          <select id="a-tag">
            <option value="경기">경기</option>
            <option value="인터뷰">인터뷰</option>
            <option value="훈련">훈련</option>
            <option value="수상">수상</option>
            <option value="기타">기타</option>
          </select>
          <button class="btn-gen" onclick="genArticleJSON()">JSON 생성</button>
        </div>
        <div class="output-block" id="a-output" style="display:none">
          <div class="output-label">👇 data.json의 "articles" 배열 맨 앞에 붙여넣으세요</div>
          <div class="json-output" id="a-json"></div>
          <button class="btn-copy" onclick="copyText('a-json', this)">📋 복사</button>
        </div>
      </div>
    </details>
    </div><!-- /admin-articles -->
    <div class="toolbar">
      <input class="search-box" type="text" id="article-search" placeholder="기사 제목 검색..." oninput="renderArticles()" />
      <div class="tag-filters" id="article-tags"></div>
    </div>
    <div class="result-count" id="article-count-label"></div>
    <div id="article-list"></div>
  </div>

  <!-- 영상 탭 -->
  <div id="tab-videos" class="tab-section">

    <div class="admin-panels" id="admin-videos">
    <details class="input-panel">
      <summary>영상 추가하기</summary>
      <div class="panel-body">
        <div class="input-row">
          <input type="url" id="v-url" placeholder="유튜브 URL 붙여넣기" oninput="previewVideo()" />
        </div>
        <div id="v-preview" style="display:none; margin:4px 0;">
          <div class="output-label" style="margin-bottom:6px">📺 미리보기</div>
          <iframe id="v-iframe" width="320" height="180" frameborder="0" allowfullscreen
            style="border-radius:var(--radius);border:1px solid var(--border)"></iframe>
        </div>
        <div class="input-row">
          <input type="date" id="v-date" />
          <input type="text" id="v-channel" placeholder="채널명" style="max-width:200px" />
        </div>
        <div class="input-row">
          <input type="text" id="v-title" placeholder="영상 제목" />
          <select id="v-tag">
            <option value="인터뷰">인터뷰</option>
            <option value="경기">경기</option>
            <option value="훈련">훈련</option>
            <option value="예능">예능</option>
            <option value="기타">기타</option>
          </select>
          <button class="btn-gen" onclick="genVideoJSON()">JSON 생성</button>
        </div>
        <div class="output-block" id="v-output" style="display:none">
          <div class="output-label">👇 data.json의 "videos" 배열 맨 앞에 붙여넣으세요</div>
          <div class="json-output" id="v-json"></div>
          <button class="btn-copy" onclick="copyText('v-json', this)">📋 복사</button>
        </div>
      </div>
    </details>
    </div><!-- /admin-videos -->
    <div class="toolbar">
      <input class="search-box" type="text" id="video-search" placeholder="영상 제목 검색..." oninput="renderVideos()" />
      <div class="tag-filters" id="video-tags"></div>
    </div>
    <div class="result-count" id="video-count-label"></div>
    <div id="video-grid" class="video-grid"></div>
  </div>

  <!-- 갤러리 탭 -->
  <div id="tab-gallery" class="tab-section">

    <div class="admin-panels" id="admin-gallery">
    <details class="input-panel">
      <summary>사진 추가하기</summary>
      <div class="panel-body">
        <div class="output-label" style="color:var(--text)">이미지 URL을 한 줄에 하나씩 붙여넣으세요</div>
        <div class="input-row">
          <textarea id="g-urls" placeholder="https://example.com/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea>
        </div>
        <div class="input-row">
          <button class="btn-gen" onclick="previewGallery()">미리보기</button>
          <button class="btn-gen green" onclick="genGalleryJSON()">JSON 생성</button>
        </div>
        <div id="g-preview-wrap" style="display:none">
          <div class="output-label">📷 미리보기</div>
          <div class="gallery-preview-grid" id="g-preview"></div>
        </div>
        <div class="output-block" id="g-output" style="display:none">
          <div class="output-label">👇 data.json의 "gallery" 배열 안에 붙여넣으세요</div>
          <div class="json-output" id="g-json"></div>
          <button class="btn-copy" onclick="copyText('g-json', this)">📋 복사</button>
        </div>
      </div>
    </details>
    </div><!-- /admin-gallery -->

    <div class="result-count" id="gallery-count-label"></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

</div>

<footer>
  <a href="https://spin-spin.com/monapi_lotte" target="_blank">monapi_lotte</a>
</footer>

<script>
  let DATA = { articles: [], videos: [], gallery: [] };
  let activeArticleTag = 'all', activeVideoTag = 'all', lbIndex = 0;

  // ── 데이터 로드 ──
  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      DATA = await res.json();
      if (!DATA.gallery) DATA.gallery = [];
    } catch(e) {
      DATA = {
        articles: [
          { date:"2025-05-21", title:"예시) 최준용, 시즌 첫 선발 등판 호투 5이닝 1실점", url:"#", source:"스포츠조선", tags:["경기"] },
          { date:"2025-05-18", title:"예시) 최준용 인터뷰 \"올 시즌 목표는 두 자릿수 승리\"", url:"#", source:"MK스포츠", tags:["인터뷰"] }
        ],
        videos: [
          { date:"2025-05-19", title:"예시) 최준용 인터뷰 - 시즌 목표와 각오", videoId:"dQw4w9WgXcQ", channel:"KBO 공식", tags:["인터뷰"] }
        ],
        gallery: []
      };
    }
    DATA.articles.sort((a,b) => b.date.localeCompare(a.date));
    DATA.videos.sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('stat-articles').textContent = DATA.articles.length;
    document.getElementById('stat-videos').textContent = DATA.videos.length;
    document.getElementById('stat-gallery').textContent = DATA.gallery.length;
    buildTagFilters(); renderArticles(); renderVideos(); renderGallery();
  }

  function buildTagFilters() {
    const aTags = ['all', ...new Set(DATA.articles.flatMap(a => a.tags||[]))];
    const vTags = ['all', ...new Set(DATA.videos.flatMap(v => v.tags||[]))];
    document.getElementById('article-tags').innerHTML = aTags.map(t =>
      `<button class="tag-btn ${t==='all'?'active':''}" onclick="setArticleTag('${t}',this)">${t==='all'?'전체':t}</button>`).join('');
    document.getElementById('video-tags').innerHTML = vTags.map(t =>
      `<button class="tag-btn ${t==='all'?'active':''}" onclick="setVideoTag('${t}',this)">${t==='all'?'전체':t}</button>`).join('');
  }
  function setArticleTag(tag,btn) {
    activeArticleTag=tag;
    document.querySelectorAll('#article-tags .tag-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); renderArticles();
  }
  function setVideoTag(tag,btn) {
    activeVideoTag=tag;
    document.querySelectorAll('#video-tags .tag-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); renderVideos();
  }

  function renderArticles() {
    const q = document.getElementById('article-search').value.toLowerCase();
    const filtered = DATA.articles.filter(a => {
      return (activeArticleTag==='all' || (a.tags||[]).includes(activeArticleTag)) &&
             (!q || a.title.toLowerCase().includes(q) || a.source.toLowerCase().includes(q));
    });
    document.getElementById('article-count-label').textContent = `${filtered.length}건 / 전체 ${DATA.articles.length}건`;
    if (!filtered.length) { document.getElementById('article-list').innerHTML='<div class="empty-state">검색 결과가 없습니다.</div>'; return; }
    document.getElementById('article-list').innerHTML = '<div class="article-list">' +
      filtered.map(a=>`
        <a class="article-item" href="${a.url}" target="_blank">
          <span class="article-date">${a.date}</span>
          <span class="article-title">${a.title}</span>
          <span class="article-right">
            ${(a.tags||[]).map(t=>`<span class="item-tag">${t}</span>`).join('')}
            <span class="article-source">${a.source}</span>
          </span>
        </a>`).join('') + '</div>';
  }

  function renderVideos() {
    const q = document.getElementById('video-search').value.toLowerCase();
    const filtered = DATA.videos.filter(v => {
      return (activeVideoTag==='all' || (v.tags||[]).includes(activeVideoTag)) &&
             (!q || v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q));
    });
    document.getElementById('video-count-label').textContent = `${filtered.length}건 / 전체 ${DATA.videos.length}건`;
    if (!filtered.length) { document.getElementById('video-grid').innerHTML='<div class="empty-state">검색 결과가 없습니다.</div>'; return; }
    document.getElementById('video-grid').innerHTML = filtered.map(v=>`
      <div class="video-card">
        <div class="video-thumb">
          <iframe src="https://www.youtube.com/embed/${v.videoId}" allowfullscreen loading="lazy"></iframe>
        </div>
        <div class="video-info">
          <h3>${v.title}</h3>
          <div class="video-meta">
            <span>${v.date}</span><span>·</span><span>${v.channel}</span>
            ${(v.tags||[]).map(t=>`<span class="item-tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>`).join('');
  }

  function renderGallery() {
    const imgs = DATA.gallery;
    document.getElementById('stat-gallery').textContent = imgs.length;
    document.getElementById('gallery-count-label').textContent = `${imgs.length}장`;
    if (!imgs.length) {
      document.getElementById('gallery-grid').innerHTML='<div class="empty-state" style="grid-column:1/-1">사진이 없습니다. 위 패널에서 추가하세요.</div>';
      return;
    }
    document.getElementById('gallery-grid').innerHTML = imgs.map((url,i)=>`
      <div class="gallery-cell" onclick="openLb(${i})">
        <img src="${url}" alt="사진 ${i+1}" loading="lazy" onerror="this.parentElement.innerHTML='<span>로드 실패</span>'" />
      </div>`).join('');
  }

  // ── 라이트박스 ──
  function openLb(i) {
    lbIndex=i;
    document.getElementById('lb-img').src=DATA.gallery[i];
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
  function closeLbOverlay(e) { if(e.target===document.getElementById('lightbox')) closeLb(); }
  function lbNav(dir) {
    lbIndex=(lbIndex+dir+DATA.gallery.length)%DATA.gallery.length;
    document.getElementById('lb-img').src=DATA.gallery[lbIndex];
  }
  document.addEventListener('keydown', e=>{
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='ArrowLeft') lbNav(-1);
    if(e.key==='ArrowRight') lbNav(1);
    if(e.key==='Escape') closeLb();
  });

  // ── 유튜브 ID 추출 ──
  function extractVideoId(url) {
    const patterns=[/[?&]v=([^&#]+)/,/youtu\.be\/([^?&#]+)/,/shorts\/([^?&#]+)/,/embed\/([^?&#]+)/];
    for(const p of patterns){const m=url.match(p);if(m)return m[1];}
    return null;
  }

  function previewVideo() {
    const id=extractVideoId(document.getElementById('v-url').value.trim());
    const wrap=document.getElementById('v-preview');
    if(id){document.getElementById('v-iframe').src=`https://www.youtube.com/embed/${id}`;wrap.style.display='block';}
    else wrap.style.display='none';
  }

  // ── JSON 생성 ──
  function showOutput(id) {
    const el=document.getElementById(id);
    el.style.display='flex'; el.style.flexDirection='column'; el.style.gap='8px';
  }
  function genArticleJSON() {
    const date=document.getElementById('a-date').value;
    const source=document.getElementById('a-source').value.trim();
    const title=document.getElementById('a-title').value.trim();
    const url=document.getElementById('a-url').value.trim();
    const tag=document.getElementById('a-tag').value;
    if(!date||!title||!url){alert('날짜, 제목, URL은 필수입니다.');return;}
    document.getElementById('a-json').textContent=`{ "date": "${date}", "title": "${title.replace(/"/g,'\\"')}", "url": "${url}", "source": "${source}", "tags": ["${tag}"] },`;
    showOutput('a-output');
  }
  function genVideoJSON() {
    const url=document.getElementById('v-url').value.trim();
    const id=extractVideoId(url);
    if(!id){alert('유효한 유튜브 URL을 입력해 주세요.');return;}
    const date=document.getElementById('v-date').value;
    const channel=document.getElementById('v-channel').value.trim();
    const title=document.getElementById('v-title').value.trim();
    const tag=document.getElementById('v-tag').value;
    if(!date||!title){alert('날짜와 제목은 필수입니다.');return;}
    document.getElementById('v-json').textContent=`{ "date": "${date}", "title": "${title.replace(/"/g,'\\"')}", "videoId": "${id}", "channel": "${channel}", "tags": ["${tag}"] },`;
    showOutput('v-output');
  }
  function previewGallery() {
    const urls=document.getElementById('g-urls').value.trim().split('\n').map(u=>u.trim()).filter(Boolean);
    if(!urls.length)return;
    document.getElementById('g-preview-wrap').style.display='block';
    document.getElementById('g-preview').innerHTML=urls.map(u=>
      `<img src="${u}" alt="" onerror="this.outerHTML='<div class=preview-err>로드 실패</div>'">`).join('');
  }
  function genGalleryJSON() {
    const urls=document.getElementById('g-urls').value.trim().split('\n').map(u=>u.trim()).filter(Boolean);
    if(!urls.length){alert('URL을 입력해 주세요.');return;}
    document.getElementById('g-json').textContent=urls.map(u=>`  "${u}"`).join(',\n');
    showOutput('g-output');
  }
  function copyText(id,btn) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
      const orig=btn.textContent; btn.textContent='✅ 복사됨!';
      setTimeout(()=>btn.textContent=orig,1500);
    });
  }

  function switchTab(name,btn) {
    document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    btn.classList.add('active');
  }

  // ── 관리자 잠금 ──
  // ✏️ 아래 비밀번호를 원하는 것으로 바꾸세요
  const ADMIN_PW = 'yong56';

  function checkPw() {
    const input = document.getElementById('admin-pw').value;
    const status = document.getElementById('lock-status');
    if (input === ADMIN_PW) {
      document.querySelectorAll('.admin-panels').forEach(el => el.classList.add('unlocked'));
      sessionStorage.setItem('ychive_admin', '1');
      status.textContent = '✅ 관리자 모드';
      status.style.color = '#2d6a4f';
      document.getElementById('admin-pw').value = '';
    } else {
      status.textContent = '❌ 비밀번호 오류';
      status.style.color = '#c0392b';
      setTimeout(() => status.textContent = '', 2000);
    }
  }

  // 세션 유지 (탭 새로고침해도 로그인 유지)
  if (sessionStorage.getItem('ychive_admin') === '1') {
    document.querySelectorAll('.admin-panels').forEach(el => el.classList.add('unlocked'));
    document.getElementById('lock-status').textContent = '✅ 관리자 모드';
    document.getElementById('lock-status').style.color = '#2d6a4f';
  }

  loadData();
</script>
</body>
</html>
